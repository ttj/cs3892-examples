name: examples

# Four things have to stay true, and each has bitten already:
#   1. every example produces the verdict its own header claims,
#   2. every example is reachable from a notebook (the Colab link students click),
#   3. the notebooks actually execute top to bottom,
#   4. every link a student can click is one a student can open.
# (3) caught a generator bug that silently dropped the last line of every code
# cell -- the repo was green, the notebook was broken.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Mondays 08:20 UTC. A link can die, and a download can move, without a push.
    - cron: "20 8 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every example is wired to a notebook and carries a verdict contract
        run: bash scripts/lint_examples.sh

  # (4) A homework README once linked its handout in a private repository: fine
  # for the instructor, a 404 for every student. check_links.py asks GitHub
  # whether each linked repository is PUBLIC and each linked file exists, and
  # refuses file: links and missing relative ones. On the weekly run and on
  # demand it also requests every other URL; on a push it does not, so that
  # somebody else's outage cannot fail a commit.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every link a student can click is one a student can open
        env:
          GH_TOKEN: ${{ github.token }}
          EXTERNAL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--external' || '' }}
        run: python3 scripts/check_links.py $EXTERNAL

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --quiet z3-solver
      # HW4's checker installs elan + Lean v4.33.0 itself (about 575 MB) when it finds no lake;
      # cache it here. The notebooks job deliberately does not: it must prove the install works.
      # The key covers check_hw4.py, which pins the elan release and its SHA-256, so a cached
      # ~/.elan always comes from the verified installer (caches from before the pin never match).
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-v4.2.4-${{ hashFiles('homework/hw4-lean/lean-toolchain', 'homework/hw4-lean/check_hw4.py') }}
      - name: Run every example against its recorded verdict
        run: bash scripts/check_examples.sh

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately a bare environment, like a fresh Colab runtime: only the
      # machinery to execute a notebook -- Colab does not ship Z3 either. Every
      # notebook has to install what it needs in its own setup cell, and FRESH=1
      # removes Z3 and downloaded tools before each one, so one notebook's install
      # cannot cover for another's. (It once did: sessions 15 and 16 passed here
      # and failed on Colab with "No module named 'z3'".)
      - run: pip install --quiet nbclient nbformat ipykernel
      - name: Execute every notebook end to end, each from a clean start
        env:
          FRESH: "1"
        run: bash scripts/run_notebooks.sh
