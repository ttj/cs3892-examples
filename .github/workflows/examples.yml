name: examples

# Four things have to stay true, and each has bitten already:
#   1. every example produces the verdict its own header claims,
#   2. every example is reachable from a notebook (the Colab link students click),
#   3. the notebooks actually execute top to bottom,
#   4. every link a student can click is one a student can open.
# (3) caught a generator bug that silently dropped the last line of every code
# cell -- the repo was green, the notebook was broken.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Mondays 08:20 UTC. A link can die, and a download can move, without a push.
    - cron: "20 8 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every example is wired to a notebook and carries a verdict contract
        run: bash scripts/lint_examples.sh

  # (4) A homework README once linked its handout in a private repository: fine
  # for the instructor, a 404 for every student. check_links.py asks GitHub
  # whether each linked repository is PUBLIC and each linked file exists, and
  # refuses file: links and missing relative ones. On the weekly run and on
  # demand it also requests every other URL; on a push it does not, so that
  # somebody else's outage cannot fail a commit.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every link a student can click is one a student can open
        env:
          GH_TOKEN: ${{ github.token }}
          EXTERNAL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--external' || '' }}
        run: python3 scripts/check_links.py $EXTERNAL

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --quiet z3-solver
      - name: Run every example against its recorded verdict
        run: bash scripts/check_examples.sh

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately a bare environment, close to what Colab gives a student:
      # only z3-solver plus the machinery to execute a notebook. If a notebook
      # needs something else, it has to install it in its own setup cell -- and
      # this job is what proves it does.
      - run: pip install --quiet z3-solver nbclient nbformat ipykernel
      - name: Execute every notebook end to end
        run: bash scripts/run_notebooks.sh
